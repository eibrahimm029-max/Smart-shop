<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Easy PCB Studio - Pro Designer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Header Navigation -->
    <header>
        <div class="logo">
            <span class="icon">⚡</span> Easy PCB STUDIO
        </div>
        <div class="header-actions">
            <button class="btn btn-danger" onclick="clearCanvas()">🗑️ মুছে ফেলুন</button>
            <button class="btn btn-success" onclick="exportGCode()">⚡ G-Code Export</button>
            <button class="btn btn-primary" onclick="exportJLCPCB()">📦 JLCPCB Order</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="main-container">
        <!-- Search & Quick Tools Bar -->
        <div class="tool-bar">
            <div class="search-box">
                <input type="text" id="componentSearch" placeholder="🔍 সার্চ করুন (ESP32, Nano, OLED, Relay...)" oninput="searchComponents()">
                <div id="searchResults" class="search-dropdown"></div>
            </div>
            <button class="tool-btn active" id="btn-wire" onclick="setTool('wire')">✏️ Wire</button>
            <button class="tool-btn" id="btn-pad" onclick="setTool('pad')">🔴 Pad</button>
        </div>

        <!-- Interactive Canvas Area -->
        <div class="canvas-wrapper">
            <canvas id="pcbCanvas"></canvas>
        </div>

        <!-- Bottom Controls & Branding Panel -->
        <div class="bottom-panel">
            <div class="input-group">
                <label>🏷️ ব্র্যান্ড/লোগো নাম:</label>
                <input type="text" id="brandText" placeholder="আপনার ব্র্যান্ডের নাম লিখুন" oninput="draw()">
            </div>
            <div class="input-group">
                <label>📏 ট্র্যাকিং থিকনেস (mm):</label>
                <input type="number" id="traceWidth" value="3" min="1" max="10" onchange="draw()">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
