<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Easy PCB Studio - Pro Designer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo">
            <span class="icon">⚡</span> Easy PCB STUDIO
        </div>
        <div class="header-actions">
            <button class="btn btn-warning" onclick="undoLast()">↩️ আন্ডু (Undo)</button>
            <button class="btn btn-danger" onclick="clearCanvas()">🗑️ সব সাফ করুন</button>
            <button class="btn btn-primary" onclick="saveDesignToLibrary()">⭐ লাইব্রেরিতে সেভ করুন</button>
            <button class="btn btn-success" onclick="exportGCode()">⚡ G-Code Download</button>
            <button class="btn btn-primary" onclick="exportJLCPCB()">📦 Gerber ZIP Export</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="main-container">
        <!-- Live Open EDA Library Search ToolBar -->
        <div class="tool-bar">
            <div class="search-box">
                <input type="text" id="componentSearch" placeholder="🔍 ইনস্ট্যান্ট পার্টস সার্চ (ESP32, Relay, OLED, Resistor, Nano)..." oninput="searchComponents()">
                <div id="searchResults" class="search-dropdown"></div>
            </div>
            <button class="tool-btn active" id="btn-wire" onclick="setTool('wire')">✏️ Wire</button>
            <button class="tool-btn" id="btn-pad" onclick="setTool('pad')">🔴 Pad</button>
            <button class="tool-btn" id="btn-select" onclick="setTool('select')">🖐️ Move/Select</button>
        </div>

        <!-- Canvas Area -->
        <div class="canvas-wrapper">
            <canvas id="pcbCanvas"></canvas>
        </div>

        <!-- Bottom Controls Panel -->
        <div class="bottom-panel">
            <div class="input-group">
                <label>🏷️️ প্রজেক্ট/ফাইল নাম:</label>
                <input type="text" id="projectName" value="My_PCB_Design" placeholder="ফাইলের নাম লিখুন">
            </div>
            <div class="input-group">
                <label>🏷️ কাস্টম লোগো/টেক্সট:</label>
                <input type="text" id="brandText" placeholder="বোর্ডে লেখার নাম" oninput="draw()">
            </div>
            <div class="input-group">
                <label>📏 ট্র্যাকিং থিকনেস (mm):</label>
                <input type="number" id="traceWidth" value="3" min="1" max="10" onchange="draw()">
            </div>
        </div>
    </div>

    <!-- JSZip Library for Client-side Gerber ZIP Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
